name: Build Kernel Xiaomi Pad 7 - Google Gemini

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Download Clang Toolchain
        run: |
          echo "Tải bộ biên dịch Proton-Clang siêu tốc..."
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang

      - name: Download Kernel Source & KernelSU
        run: |
          echo "Tải mã nguồn Kernel..."
          git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b uke-u-oss --depth=1 uke-kernel
          
          echo "Chèn KernelSU vào Source..."
          cd uke-kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Build Kernel Image
        run: |
          cd uke-kernel
          
          echo "1. Fix lỗi thiếu file từ Xiaomi..."
          sed -i '/hwid/d' drivers/misc/Kconfig
          sed -i '/hwid/d' drivers/misc/Makefile
          sed -i 's/u64 clidr;/u64 clidr = 0;/g' arch/arm64/kvm/sys_regs.c
          
          echo "2. FIX LỖI TỬ HUYỆT VMA_PAD_START (Phẫu thuật code C)..."
          sed -i 's/VMA_PAD_START(vma)/vma->vm_end/g' fs/proc/task_mmu.c
          
          echo "2.1 FIX LỖI KSU ẨN (Ép giá trị 0 để vượt rào biên dịch)..."
          sed -i 's/ksu_late_loaded/0/g' drivers/kernelsu/feature/selinux_hide.c
          
          echo "3. Thiết lập trình biên dịch..."
          export KCFLAGS="-Wno-error"
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="clang"
          export LD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          
          echo "4. Biên dịch GKI Defconfig..."
          make O=out gki_defconfig
          
          echo "5. Tắt BTF Debug..."
          scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_BTF
          
          echo "6. Bắt đầu Compile (Quá trình này mất khoảng 15-20 phút)..."
          make -j$(nproc) O=out

      - name: Pack AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp uke-kernel/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          
          echo "Tự động cấu hình AnyKernel3 cho Xiaomi Pad 7 (uke)..."
          sed -i 's/device.name1=maguro/device.name1=uke/g' anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=boot;|g' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel.sh
          
          zip -r9 ../AnyKernel3-Pad7-KSU.zip * -x .git\* README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-Pad7-KSU
          path: AnyKernel3-Pad7-KSU.zip
