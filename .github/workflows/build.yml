name: Build Xiaomi Pad 7 (Kleaf/Bazel) - KSU Next + SuSFS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel (Kleaf)
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          echo "Dọn dẹp không gian để chạy Bazel..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /var/lib/docker
          docker image prune -a -f
          sudo apt-get clean
          df -h

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget tar zip zstd cpio lz4 python3 rsync bc bison flex libssl-dev libncurses-dev libelf-dev

      - name: Clone Xiaomi uke-v-oss Source
        run: |
          git clone --depth=1 -b uke-v-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git uke-kernel

      - name: Integrate KernelSU Next & SuSFS
        run: |
          cd uke-kernel
          
          echo "1. Cài đặt KernelSU Next (Bypass lỗi 404 siêu chuẩn)..."
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" -o setup.sh
          
          # Thay lệnh git bằng lệnh echo để CHỐNG LỖI CÚ PHÁP "fi"
          sed -i 's/git clone/echo clone/g' setup.sh
          sed -i 's/git pull/echo pull/g' setup.sh
          sed -i 's/git checkout/echo checkout/g' setup.sh
          sed -i 's/git fetch/echo fetch/g' setup.sh
          
          chmod +x setup.sh
          ./setup.sh
          
          echo "2. Tải SuSFS nhánh GKI 6.1..."
          cd ..
          git clone -b gki-android14-6.1 https://gitlab.com/simonpunk/susfs4ksu.git
          
          echo "3. Cài mã vá SuSFS vào Kernel GKI..."
          cp -v susfs4ksu/kernel_patches/fs/* uke-kernel/fs/
          cp -v susfs4ksu/kernel_patches/include/linux/* uke-kernel/include/linux/
          
          cd uke-kernel
          GKI_PATCH=$(find ../susfs4ksu -type f -name "*.patch" | grep -i "gki" | grep -v "KernelSU" | head -n 1)
          echo "Áp dụng patch GKI: $GKI_PATCH"
          patch -p1 --forward --fuzz=3 < "$GKI_PATCH" || echo "[-] Bỏ qua xung đột GKI."
          
          echo "4. Cài mã vá SuSFS vào KSU Next..."
          cd KernelSU
          cp ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
          sed -i 's/kernel\/ksu.c/kernel\/core.c/g' 10_enable_susfs_for_ksu.patch
          patch -p1 --forward --fuzz=3 < 10_enable_susfs_for_ksu.patch || echo "[-] Bỏ qua xung đột KSU Next."

      - name: Build Kernel with Kleaf/Bazel
        run: |
          cd uke-kernel
          
          echo "Khởi chạy Bazel/Kleaf build..."
          export BUILD_CONFIG=common/build.config.gki.aarch64
          export LTO=thin
          
          bash build/build.sh -j$(nproc)
          
          echo "Tìm file Image sau khi build..."
          find out/ -name "Image" -type f -exec cp {} . \;

      - name: Pack AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp uke-kernel/Image AnyKernel3/ || echo "Không tìm thấy file Image!"
          cd AnyKernel3
          zip -r9 ../AnyKernel3-Pad7-Kleaf-KSUNext.zip * -x .git\* README.md *placeholder

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-Pad7-Kleaf-KSUNext
          path: AnyKernel3-Pad7-Kleaf-KSUNext.zip
