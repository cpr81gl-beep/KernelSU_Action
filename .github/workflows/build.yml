name: Build Xiaomi Pad 7 (Make) - KSU v1.1.4 + SuSFS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          echo "Dọn dẹp dung lượng hệ thống..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /var/lib/docker
          docker image prune -a -f
          sudo apt-get clean
          df -h

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev libelf-dev git curl wget tar zip zstd cpio lz4 python3 dwarves

      - name: Download AOSP Clang & Kernel Source
        run: |
          echo "1. Tải Google AOSP Clang 18..."
          git clone --filter=blob:none --no-checkout https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-repo
          cd clang-repo
          git sparse-checkout set clang-r522817
          git checkout main
          cd ..
          mv clang-repo/clang-r522817 clang
          rm -rf clang-repo

          echo "2. Clone mã nguồn Xiaomi uke-v-oss..."
          git clone --depth=1 -b uke-v-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git uke-kernel

      - name: Integrate KernelSU (v1.1.4) & SuSFS
        run: |
          cd uke-kernel
          
          echo "1. Cài đặt KernelSU Gốc (Khóa bản Vàng v1.1.4)..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" > setup.sh
          chmod +x setup.sh
          ./setup.sh v1.1.4
          
          echo "2. Tải mã nguồn SuSFS chính thức..."
          cd ..
          git clone -b gki-android14-6.1 https://gitlab.com/simonpunk/susfs4ksu.git
          
          echo "3. Copy và vá GKI..."
          cp -v susfs4ksu/kernel_patches/fs/* uke-kernel/fs/
          cp -v susfs4ksu/kernel_patches/include/linux/* uke-kernel/include/linux/
          
          cd uke-kernel
          GKI_PATCH=$(find ../susfs4ksu -type f -name "*.patch" | grep -i "gki" | grep -v "KernelSU" | head -n 1)
          patch -p1 --forward --fuzz=3 < "$GKI_PATCH" || true
          
          echo "4. Vá SuSFS vào KSU v1.1.4..."
          cd KernelSU
          cp ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
          patch -p1 --forward --fuzz=3 < 10_enable_susfs_for_ksu.patch || true

      - name: Build Kernel Image
        run: |
          cd uke-kernel
          
          echo "1. Fix lỗi thiếu file từ Xiaomi..."
          sed -i '/hwid/d' drivers/misc/Kconfig
          sed -i '/hwid/d' drivers/misc/Makefile
          sed -i 's/u64 clidr;/u64 clidr = 0;/g' arch/arm64/kvm/sys_regs.c
          
          echo "2. FIX LỖI TỬ HUYỆT VMA_PAD_START (Phẫu thuật code C)..."
          sed -i 's/VMA_PAD_START(vma)/vma->vm_end/g' fs/proc/task_mmu.c
          echo "2.1 FIX LỖI KSU ẨN (Lỗi phát sinh)..."
          sed -i 's/ksu_late_loaded/0/g' drivers/kernelsu/feature/selinux_hide.c
          
          echo "3. Thiết lập trình biên dịch..."
          export KCFLAGS="-Wno-error"
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="clang"
          export LD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          
          echo "4. Biên dịch gki_defconfig..."
          make O=out gki_defconfig
          
          echo "5. Tắt BTF Debug..."
          scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_BTF
          
          echo "6. Compile..."
          make -j$(nproc) O=out

      - name: Pack AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp uke-kernel/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          echo "Tự động cấu hình AnyKernel3 cho Xiaomi Pad 7 (uke)..."
          sed -i 's/device.name1=maguro/device.name1=uke/g' anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=boot;|g' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel.sh
          
          zip -r9 ../AnyKernel3-Pad7-KSU114.zip * -x .git\* README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-Pad7-KSU114
          path: AnyKernel3-Pad7-KSU114.zip
